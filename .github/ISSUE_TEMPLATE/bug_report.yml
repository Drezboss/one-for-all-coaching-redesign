name: 🐛 Bug Report
description: File a bug report to help us improve the application
title: "[BUG] "
labels: ["bug", "needs-triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! 🙏
        
        Before submitting, please:
        - Search existing issues to avoid duplicates
        - Make sure you're using the latest version
        - Test in incognito/private browsing mode

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission Checklist
      description: Please confirm the following
      options:
        - label: I have searched for existing issues that describe this bug
          required: true
        - label: I have tested this on the latest version
          required: true
        - label: I can reproduce this bug consistently
          required: true

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      description: Where did this bug occur?
      options:
        - Development (localhost)
        - Staging
        - Production
        - All environments
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of the application is affected?
      options:
        - Frontend (React/Client)
        - Backend (API)
        - Directus CMS
        - Database
        - Deployment/Infrastructure
        - Authentication
        - UI/UX
        - Performance
        - Other
    validations:
      required: true

  - type: textarea
    id: bug-description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is
      placeholder: "Describe what happened and what you expected to happen..."
    validations:
      required: true

  - type: textarea
    id: reproduction-steps
    attributes:
      label: Steps to Reproduce
      description: Detailed steps to reproduce the behavior
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
      value: |
        1. 
        2. 
        3. 
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: "Describe what should have happened..."
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual Behavior
      description: What actually happened?
      placeholder: "Describe what actually happened..."
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots/Videos
      description: If applicable, add screenshots or videos to help explain the problem
      placeholder: "Paste screenshots or drag & drop files here..."

  - type: textarea
    id: browser-info
    attributes:
      label: Browser Information
      description: Please provide browser and device information
      placeholder: |
        - Browser: Chrome 120.0.0.0
        - OS: macOS 14.0
        - Device: MacBook Pro
        - Screen Resolution: 1440x900
      value: |
        - Browser: 
        - OS: 
        - Device: 
        - Screen Resolution: 

  - type: textarea
    id: console-errors
    attributes:
      label: Console Errors
      description: Any errors in the browser console or server logs
      placeholder: "Paste any relevant console errors or logs here..."
      render: shell

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context about the problem here
      placeholder: "Any additional information that might help us understand the issue..."

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How urgent is this bug?
      options:
        - Low - Minor issue, workaround available
        - Medium - Affects functionality but not critical
        - High - Blocks important functionality
        - Critical - Breaks core functionality or security issue
    validations:
      required: true