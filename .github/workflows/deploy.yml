name: 🚀 Deploy to Production

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

env:
  NODE_VERSION: '18'

jobs:
  # =============================================================================
  # PRE-DEPLOYMENT SECURITY CHECK
  # =============================================================================
  security-gate:
    name: 🔒 Security Gate
    runs-on: ubuntu-latest
    outputs:
      security-passed: ${{ steps.security-check.outputs.passed }}
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔍 Critical vulnerability scan
        id: security-check
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          format: 'json'
          output: 'security-results.json'

      - name: 📤 Upload security results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-scan-results
          path: security-results.json

  # =============================================================================
  # BUILD FOR PRODUCTION
  # =============================================================================
  build-production:
    name: 🏗️ Production Build
    runs-on: ubuntu-latest
    needs: security-gate
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci --production=false

      - name: 🔍 TypeScript check
        run: npm run check

      - name: 🏗️ Build for production
        run: npm run build
        env:
          NODE_ENV: production
          CI: true

      - name: 📊 Analyze bundle
        run: |
          du -sh dist/*
          echo "Build size analysis:"
          find dist -name "*.js" -exec du -h {} \; | sort -hr

      - name: 📤 Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: dist/
          retention-days: 30

  # =============================================================================
  # PRODUCTION TESTS
  # =============================================================================
  production-tests:
    name: 🧪 Production Tests
    runs-on: ubuntu-latest
    needs: build-production
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: ⬇️ Download production build
        uses: actions/download-artifact@v4
        with:
          name: production-build
          path: dist/

      - name: 🧪 Run production tests
        run: |
          npm run test:production 2>/dev/null || echo "No production tests configured"
        env:
          NODE_ENV: production

      - name: 🔍 Smoke tests
        run: |
          npm run test:smoke 2>/dev/null || echo "No smoke tests configured"

  # =============================================================================
  # DEPLOY TO VERCEL
  # =============================================================================
  deploy-vercel:
    name: 🚀 Deploy to Vercel
    runs-on: ubuntu-latest
    needs: [build-production, production-tests]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    environment:
      name: production
      url: ${{ steps.deploy.outputs.preview-url }}
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ⬇️ Download production build
        uses: actions/download-artifact@v4
        with:
          name: production-build
          path: dist/

      - name: 🚀 Deploy to Vercel
        id: deploy
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          scope: ${{ secrets.VERCEL_ORG_ID }}

      - name: 📝 Update deployment status
        run: |
          echo "Deployment successful!"
          echo "URL: ${{ steps.deploy.outputs.preview-url }}"

  # =============================================================================
  # DEPLOY CMS TO RENDER
  # =============================================================================
  deploy-cms:
    name: 🗄️ Deploy CMS to Render
    runs-on: ubuntu-latest
    needs: [build-production, production-tests]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    environment:
      name: production-cms
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🚀 Trigger Render deployment
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}" \
            -H "Content-Type: application/json" \
            -d '{"ref": "${{ github.ref }}", "sha": "${{ github.sha }}"}'

      - name: ⏳ Wait for deployment
        run: |
          echo "Waiting for Render deployment to complete..."
          sleep 60

  # =============================================================================
  # POST-DEPLOYMENT VERIFICATION
  # =============================================================================
  post-deployment-check:
    name: ✅ Post-deployment Verification
    runs-on: ubuntu-latest
    needs: [deploy-vercel, deploy-cms]
    if: always() && (needs.deploy-vercel.result == 'success' || needs.deploy-cms.result == 'success')
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 🏥 Health check - Frontend
        run: |
          MAX_ATTEMPTS=5
          ATTEMPT=1
          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "Health check attempt $ATTEMPT..."
            if curl -f -s --max-time 30 "${{ secrets.PRODUCTION_URL }}/health" > /dev/null; then
              echo "Frontend health check passed!"
              break
            elif [ $ATTEMPT -eq $MAX_ATTEMPTS ]; then
              echo "Frontend health check failed after $MAX_ATTEMPTS attempts"
              exit 1
            else
              echo "Attempt $ATTEMPT failed, retrying in 30 seconds..."
              sleep 30
              ATTEMPT=$((ATTEMPT + 1))
            fi
          done

      - name: 🏥 Health check - CMS
        run: |
          MAX_ATTEMPTS=5
          ATTEMPT=1
          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "CMS health check attempt $ATTEMPT..."
            if curl -f -s --max-time 30 "${{ secrets.CMS_URL }}/server/health" > /dev/null; then
              echo "CMS health check passed!"
              break
            elif [ $ATTEMPT -eq $MAX_ATTEMPTS ]; then
              echo "CMS health check failed after $MAX_ATTEMPTS attempts"
              exit 1
            else
              echo "Attempt $ATTEMPT failed, retrying in 30 seconds..."
              sleep 30
              ATTEMPT=$((ATTEMPT + 1))
            fi
          done

      - name: 🔍 Run smoke tests against production
        run: |
          npm run test:smoke:production 2>/dev/null || echo "No production smoke tests configured"
        env:
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
          CMS_URL: ${{ secrets.CMS_URL }}

  # =============================================================================
  # NOTIFICATION & ROLLBACK
  # =============================================================================
  notify-deployment:
    name: 📢 Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [deploy-vercel, deploy-cms, post-deployment-check]
    if: always()
    steps:
      - name: 📊 Determine deployment status
        id: status
        run: |
          if [[ "${{ needs.post-deployment-check.result }}" == "success" ]]; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "message=🎉 Deployment completed successfully!" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "message=❌ Deployment failed or verification failed" >> $GITHUB_OUTPUT
          fi

      - name: 📧 Send notification
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ steps.status.outputs.status }}
          text: |
            ${{ steps.status.outputs.message }}
            
            📋 Deployment Details:
            • Repository: ${{ github.repository }}
            • Branch: ${{ github.ref_name }}
            • Commit: ${{ github.sha }}
            • Actor: ${{ github.actor }}
            • Frontend: ${{ needs.deploy-vercel.result }}
            • CMS: ${{ needs.deploy-cms.result }}
            • Verification: ${{ needs.post-deployment-check.result }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        if: always()

  # =============================================================================
  # CREATE RELEASE
  # =============================================================================
  create-release:
    name: 📦 Create Release
    runs-on: ubuntu-latest
    needs: [post-deployment-check]
    if: startsWith(github.ref, 'refs/tags/v') && needs.post-deployment-check.result == 'success'
    permissions:
      contents: write
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⬇️ Download production build
        uses: actions/download-artifact@v4
        with:
          name: production-build
          path: dist/

      - name: 📦 Create release archive
        run: |
          tar -czf production-build.tar.gz dist/
          zip -r production-build.zip dist/

      - name: 📝 Generate release notes
        id: release-notes
        run: |
          # Get the previous tag
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          
          # Generate changelog
          if [ -n "$PREVIOUS_TAG" ]; then
            echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
            echo "## Changes since $PREVIOUS_TAG" >> $GITHUB_OUTPUT
            git log --pretty=format:"- %s (%h)" $PREVIOUS_TAG..HEAD >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "CHANGELOG=Initial release" >> $GITHUB_OUTPUT
          fi

      - name: 🏷️ Create GitHub release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          body: |
            ${{ steps.release-notes.outputs.CHANGELOG }}
            
            ## Deployment Information
            - **Frontend URL**: ${{ secrets.PRODUCTION_URL }}
            - **CMS URL**: ${{ secrets.CMS_URL }}
            - **Deployed at**: ${{ github.event.head_commit.timestamp }}
            
            ## Artifacts
            The production build artifacts are attached to this release.
          draft: false
          prerelease: false